<title>Korea Survival Kit 🇰🇷</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f6f4;--card:#fff;--text:#161616;--muted:#777;--line:#e8e8e5;--dark:#111;--soft:#f0f0ed}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
button,input{font:inherit}
.app{width:100%;max-width:760px;margin:auto;padding:14px 14px 28px;min-height:100dvh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-weight:900;font-size:14px}
.lang{display:flex;background:#e9e9e6;border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}
.lang button.active{background:#111;color:#fff}
.hero{padding:28px 4px 24px}
.flag{font-size:48px}
h1{font-size:38px;letter-spacing:-1.8px;margin:8px 0}
.hero p{color:var(--muted);margin:0;line-height:1.5}
.search{display:flex;gap:8px;margin-bottom:16px}
.search input{flex:1;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 16px;outline:0}
.search button{border:0;background:#111;color:#fff;border-radius:15px;padding:0 18px;font-weight:800;cursor:pointer}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
.module{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px;text-align:left;cursor:pointer;min-height:88px;transition:.15s}
.module:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0000000d}
.module .icon{font-size:25px;margin-bottom:9px}
.module strong{display:block;font-size:14px}
.module span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:8px 0 10px}
.section-head h2{font-size:18px;margin:0}
.count{font-size:12px;color:#999}
.filters{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#666;cursor:pointer}
.filter.active{background:#111;color:#fff;border-color:#111}
.cards{display:flex;flex-direction:column;gap:9px;max-height:52dvh;overflow-y:auto;padding:1px 3px 8px 1px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;flex:0 0 auto;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:0 8px 22px #0000000b}
.card .ko{font-size:21px;font-weight:900;margin-bottom:7px}
.card .en{font-size:13px}
.card .zh{font-size:12px;color:#888;margin-top:4px}
.card .tag{display:inline-block;background:var(--soft);border-radius:7px;padding:4px 7px;font-size:10px;color:#777;margin-top:12px}
.random{width:100%;border:0;border-radius:16px;background:#111;color:#fff;padding:15px;margin-top:16px;font-weight:800;cursor:pointer}
.footer{text-align:center;color:#aaa;font-size:11px;margin-top:20px;line-height:1.7}
.empty{grid-column:1/-1;text-align:center;color:#999;padding:45px 10px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(5px)}
.modal.show{display:flex}
.sheet{width:min(700px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:25px;padding:22px;box-shadow:0 24px 80px #0003}
.close{float:right;width:35px;height:35px;border:0;border-radius:50%;background:#eee;font-size:21px;cursor:pointer}
.modal-title{font-size:31px;font-weight:900;margin:12px 0 3px;padding-right:45px}
.literal{color:#777;font-size:13px}
.block{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.label{font-size:10px;color:#999;font-weight:900;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.value{font-size:14px;line-height:1.6}
.bilingual{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langbox{background:#f6f6f4;border-radius:14px;padding:12px}
.langbox b{display:block;font-size:10px;color:#999;margin-bottom:5px}
.langbox div{font-size:13px;line-height:1.5}
@media(max-width:520px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:88dvh;padding:20px}.app{padding:10px 10px 22px}.top{margin-bottom:10px}.brand{font-size:12px}.lang button{padding:6px 8px;font-size:10px}.hero{padding:16px 3px 16px}.flag{font-size:38px}h1{font-size:29px;margin:6px 0}.hero p{font-size:13px}.search input{padding:12px 13px}.search button{padding:0 14px}.modules{grid-template-columns:repeat(2,1fr);gap:7px}.module{min-height:78px;padding:11px}.module .icon{font-size:21px;margin-bottom:6px}.module strong{font-size:12px}.module span{font-size:9px}.cards{max-height:48dvh}.bilingual{grid-template-columns:1fr}.modal-title{font-size:27px}}
</style>
</head>

</div></div>

 en:{title:'Korea Survival Kit',subtitle:'Your tiny guide to surviving everyday life in Korea.',search:'Search Korean words or phrases...',searchBtn:'Search',list:'Useful Korean',random:'🎲 Random Korean Phrase',footer:'Korea Survival Kit 🇰🇷<br>Made for curious people traveling and living in Korea.',all:'All',empty:'No matches found.',meaning:'What it means',example:'Example',note:'Usage note',close:'Close',count:n=>`${n} items`,modules:{Phrases:['Korean Phrases','Useful everyday Korean'],Slang:['Korean Slang','Natural casual expressions'],Food:['What to Eat','Order Korean food with confidence'],Money:['Money & N-bbang','Prices, payments & splitting bills'],Culture:['Culture & Social','Everyday Korean etiquette & fun'],Subway:['Subway Help','Stations, transfers & getting around']},cats:{Phrases:'Phrases',Slang:'Slang',Food:'Food',Money:'Money',Culture:'Culture',Subway:'Subway'}},

const D=[["좋은 아침이에요","Good morning","早上好","Phrases","A polite way to say good morning.","Friendly and polite.","좋은 아침이에요!","Good morning!","早上好！"],["안녕","Hi / Bye","你好 / 再见","Phrases","A casual hello or goodbye.","Use with friends and people close to you.","안녕! 오늘 뭐 해?","Hi! What are you doing today?","你好！今天做什么？"],["안녕히 가세요","Goodbye","再见（对离开的人说）","Phrases","Goodbye said to someone who is leaving.","The person staying says this.","안녕히 가세요!","Goodbye!","再见！"],["안녕히 계세요","Goodbye","再见（对留下的人说）","Phrases","Goodbye said when you are leaving.","The person leaving says this.","그럼 안녕히 계세요.","Then, goodbye.","那么，再见。"],["잘 지냈어요?","Have you been well?","最近过得好吗？","Phrases","Have you been doing well?","A natural greeting after some time apart.","잘 지냈어요?","Have you been well?","最近过得好吗？"],["오랜만이에요","Long time no see","好久不见","Phrases","Long time no see.","Very common after not seeing someone for a while.","오랜만이에요!","Long time no see!","好久不见！"],["만나서 반가워요","Nice to meet you","很高兴认识你","Phrases","Nice to meet you.","Friendly-polite first meeting phrase.","만나서 반가워요.","Nice to meet you.","很高兴认识你。"],["잘 부탁드립니다","Please take good care of me / I look forward to working with you","请多关照","Phrases","A polite phrase used when starting a relationship or cooperation.","Very common in work and introductions.","앞으로 잘 부탁드립니다.","I look forward to working with you.","以后请多关照。"],["잘 부탁해","Please take care of me","请多关照","Phrases","Casual version of 잘 부탁드립니다.","Use with friends or close colleagues.","앞으로 잘 부탁해!","Please take good care of me!","以后请多关照！"],["괜찮으세요?","Are you okay?","你还好吗？","Phrases","Are you okay?","Useful when checking on someone.","괜찮으세요? 다치셨어요?","Are you okay? Are you hurt?","你还好吗？受伤了吗？"],["문제없어요","No problem","没问题","Phrases","There is no problem.","Useful for reassuring someone.","문제없어요. 괜찮아요.","No problem. It’s okay.","没问题，没关系。"],["아니에요","No / It’s not","不是 / 不用谢","Phrases","It is not / no; can also respond to thanks modestly.","Context changes the nuance.","아니에요, 괜찮아요.","No, it’s okay.","不用谢，没关系。"],["정말요?","Really?","真的吗？","Phrases","Really?","Polite version of 진짜요?","정말요? 너무 좋네요.","Really? That’s great.","真的吗？太好了。"],["맞죠?","Right?","对吧？","Phrases","Right? / You agree, right?","Used to seek agreement.","이거 맛있죠?","This is good, right?","这个很好吃，对吧？"],["그렇구나","Oh, I see","原来如此","Phrases","Oh, I see / so that’s how it is.","Natural response when learning new information.","아, 그렇구나.","Oh, I see.","啊，原来如此。"],["그렇군요","I see","原来如此","Phrases","I see.","Polite version of 그렇구나.","아, 그렇군요.","Ah, I see.","啊，原来如此。"],["어떡해요?","What should I do?","怎么办？","Phrases","What should I do? / Oh no.","Can express worry or surprise.","지갑을 잃어버렸어요. 어떡해요?","I lost my wallet. What should I do?","我的钱包丢了，怎么办？"],["어떻게 해요?","How do I do it?","怎么做？","Phrases","How do I do this?","Useful when asking for instructions.","이거 어떻게 해요?","How do I do this?","这个怎么做？"],["왜요?","Why?","为什么？","Phrases","Why?","Casual-polite way to ask why.","왜요? 무슨 일 있어요?","Why? Is something wrong?","为什么？有什么事吗？"],["뭐예요?","What is it?","是什么？","Phrases","What is it?","Simple identification question.","이거 뭐예요?","What is this?","这个是什么？"],["누구예요?","Who is it?","是谁？","Phrases","Who is it?","Useful on the phone or when asking about someone.","저 사람 누구예요?","Who is that person?","那个人是谁？"],["언제예요?","When is it?","什么时候？","Phrases","When is it?","Useful for schedules and plans.","약속이 언제예요?","When is the appointment?","约会是什么时候？"],["나중에","Later","以后 / 待会儿","Phrases","Later.","Often used for casual plans.","나중에 연락할게요.","I’ll contact you later.","我晚点联系你。"],["다음에","Next time","下次","Phrases","Next time.","Useful when postponing or making future plans.","다음에 같이 가요.","Let’s go together next time.","下次一起去吧。"],["또","Again","又 / 再","Phrases","Again / another time.","Common with 또 봐요, 또 먹어요, etc.","또 만나요.","See you again.","下次再见。"],["같이","Together","一起","Phrases","Together.","Useful for invitations and plans.","같이 갈래요?","Do you want to go together?","要一起去吗？"],["혼자","Alone","一个人","Phrases","Alone / by oneself.","Useful when explaining who you are with.","오늘 혼자 왔어요.","I came alone today.","我今天一个人来的。"],["진짜","Really / real","真的 / 真","Slang","Really / seriously / genuine.","Very common in casual speech and chat.","진짜 맛있다!","This is seriously good!","真的很好吃！"],["어머","Oh my","哎呀 / 天啊","Slang","Oh my / goodness.","Often associated with surprise; can sound playful.","어머, 너무 예뻐요!","Oh my, it’s so pretty!","哎呀，太漂亮了！"],["아 진짜","Oh, seriously","啊，真是的","Slang","Oh, seriously / come on.","Tone depends heavily on context.","아 진짜, 왜 그래?","Oh, seriously, what are you doing?","啊真是的，你怎么了？"],["맞아","Exactly / That’s right","对 / 没错","Slang","Exactly / that’s right.","Casual form of 맞아요.","맞아, 나도 그렇게 생각해.","Exactly, I think so too.","对，我也这么想。"],["아니","No / Wait","不是 / 等等","Slang","No / wait / hey.","Very common conversational filler.","아니, 그게 아니라...","No, that’s not what I mean...","不是，我不是那个意思……"],["그냥","Just / simply","就是 / 只是","Slang","Just / simply / for no particular reason.","Extremely common conversational word.","그냥 집에 있었어.","I just stayed home.","我就是待在家里。"],["약간","Kind of / a little","有点 / 稍微","Slang","Kind of / somewhat.","Often used to soften or qualify a statement.","약간 어려워.","It’s kind of difficult.","有点难。"],["별로","Not really","不太 / 不怎么","Slang","Not particularly / not really.","Often used with a negative verb/adjective.","별로 안 좋아해요.","I don’t really like it.","我不太喜欢。"],["엄청","Very / extremely","非常 / 超级","Slang","Extremely / very.","Casual intensifier.","엄청 맛있어요.","It’s extremely delicious.","非常好吃。"],["너무","Too / very","太 / 非常","Slang","Very / too.","Common intensifier; context determines nuance.","너무 좋아요.","I really like it.","我非常喜欢。"],["조금","A little","一点","Phrases","A little.","Useful for polite softening.","조금만 주세요.","Just a little, please.","请给我一点点。"],["좀","A little / please","一点 / 请","Slang","A little; often softens a request.","One of the most frequent Korean words.","조금만 좀 기다려 주세요.","Please wait just a little.","请稍等一下。"],["많이","A lot / much","很多 / 很","Phrases","A lot / much.","Useful for quantities function setLang(l){lang=l; $('enBtn').classList.toggle('active',l==='en');$('zhBtn').classList.toggle('active',l==='zh');renderUI();renderFilters();render();}
function renderUI(){const u=UI[lang];$('title').textContent=u.title;$('subtitle').textContent=u.subtitle;$('search').placeholder=u.search;$('searchBtn').textContent=u.searchBtn;$('listTitle').textContent=u.list;$('randomBtn').textContent=u.random;$('footer').innerHTML=u.footer;['Phrases','Slang','Food','Money','Culture','Subway'].forEach(k=>{$('mod'+k).textContent=u.modules[k][0];$('mod'+k+'Sub').textContent=u.modules[k][1]});}
function renderFilters(){const u=UI[lang];$('filters').innerHTML=['All','Phrases','Slang','Food','Money','Culture','Subway'].map(c=>`<button class="filter ${current===c?'active':''}" onclick="selectCategory('${c}')">${c==='All'?u.all:u.cats[c]}</button>`).join('');}
function selectCategory(c){current=c; $('search').value=''; renderFilters();render();window.scrollTo({top:document.querySelector('.section-head').offsetTop-10,behavior:'smooth'});}
function doSearch(){const q=$('search').value.trim().toLowerCase();filtered=phrases.filter(p=>[p.ko,p.en,p.zh,p.meaning,p.exampleKo,p.exampleEn,p.exampleZh].join(' ').toLowerCase().includes(q) && (current==='All'||p.cat===current));render(true);}
function render(fromSearch=false){const u=UI[lang];let list=fromSearch?filtered:phrases.filter(p=>current==='All'||p.cat===current);filtered=list;$('count').textContent=u.count(list.length);$('cards').innerHTML=list.length?list.map((p,i)=>`<div class="card" onclick="openModal(${phrases.indexOf(p)})"><div class="ko">${p.ko}</div><div class="en">${p[lang]}</div><div class="tag">${u.cats[p.cat]}</div></div>`).join(''):`<div class="empty">${u.empty}</div>`;}
function openModal(i){const p=phrases[i],u=UI[lang];$('mKo').textContent=p.ko;$('mAlt').textContent=p[lang];$('labelMeaning').textContent=u.meaning;$('mMeaning').textContent=p.meaning;$('labelExample').textContent=u.example;$('mExample').innerHTML=`<div style="font-size:18px;font-weight:800;margin-bottom:6px">${p.exampleKo}</div>${lang==='en'?p.exampleEn:p.exampleZh}`;$('labelNote').textContent=u.note;$('mNote').textContent=p.note;$('modal').classList.add('show');document.body.style.overflow='hidden';}
function closeModal(){$('modal').classList.remove('show');document.body.style.overflow='';}
function outsideClose(e){if(e.target===$('modal'))closeModal();}
function randomPhrase(){const p=phrases[Math.floor(Math.random()*phrases.length)];openModal(phrases.indexOf(p));}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setLang('en');
</script>
</body>
</html>
