<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물고기 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b2140;--bg2:#0e3a63;--tank1:#12588f;--tank2:#082744;--fg:#eaf4ff;--accent:#ffd166;--accent2:#ffb703;--danger:#ef476f;--good:#2dd4bf}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--fg);font-family:'Jua','Segoe UI',sans-serif;overscroll-behavior:none}
#app{display:flex;height:100vh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sidebar{width:108px;flex:0 0 auto;background:#0a1c33;padding:12px 8px;display:flex;flex-direction:column;gap:8px;box-shadow:2px 0 14px #00000055;z-index:4;overflow-y:auto}
.pill{background:linear-gradient(#ffffff22,#ffffff0d);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700;box-shadow:inset 0 0 0 1px #ffffff22;display:flex;align-items:center;justify-content:center;gap:5px}
.pill b{font-size:15px}
#sidebar button{width:100%;padding:10px 4px;font-size:12px;border-radius:12px;background:linear-gradient(#ffffff26,#ffffff0d);color:var(--fg);border:none;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff2a,0 3px 0 #00000033}
#sidebar button:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px #ffffff2a}
#sidebar button.locked{opacity:.55}
#shopPanel{width:0;flex:0 0 auto;background:linear-gradient(#173a5e,#0e2846);overflow:hidden;transition:width .25s ease;box-shadow:2px 0 14px #00000055;z-index:3}
#shopPanel.open{width:320px;max-width:78vw;overflow-y:auto;overflow-x:hidden}
#main{flex:1;position:relative;padding:14px;min-width:0}
#tank{position:absolute;inset:14px;background:linear-gradient(var(--tank1),var(--tank2));border-radius:20px;overflow:hidden;touch-action:manipulation;box-shadow:inset 0 0 50px #00000066,0 0 0 3px #ffffff1a}
#bossBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000000aa;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:5;white-space:nowrap;box-shadow:inset 0 0 0 1px #ffffff22}
@media (max-width:640px){
#app{flex-direction:column}
#sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
.pill{flex:1 1 70px}
#sidebar button{flex:1 1 70px;width:auto}
#shopPanel{width:auto;flex:0 0 auto;max-height:0;overflow:hidden;transition:max-height .25s ease}
#shopPanel.open{width:100%;max-width:100%;max-height:44vh;overflow-y:auto;overflow-x:hidden}
#main{padding:10px;flex:1;min-height:0}
}
.bubble{position:absolute;bottom:-20px;width:10px;height:10px;background:#ffffff40;border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-100%);opacity:0}}
.seaweed{position:absolute;bottom:0;border-radius:45% 45% 4px 4px/65% 65% 4px 4px;transform-origin:bottom center;animation:sway ease-in-out infinite;background:linear-gradient(#3aa66b,#1f6b45)}
@keyframes sway{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-7deg)}}
.rock{position:absolute;bottom:0;background:radial-gradient(circle at 30% 25%,#5b6b7a,#2c3841);border-radius:50% 50% 45% 45%/60% 60% 35% 35%}
.reefEgg{position:absolute;bottom:2px;font-size:26px;opacity:.9;filter:drop-shadow(0 2px 3px #00000066)}
.fish{position:absolute;cursor:pointer;user-select:none;transform:translate(-50%,-50%) scaleX(var(--dir,1));transition:left .12s linear,top .12s linear;filter:drop-shadow(0 3px 4px #00000055);z-index:2}
.fish.hungry{filter:drop-shadow(0 3px 4px #00000055) grayscale(0.7) brightness(0.65)}
.fish.eating{animation:eat .35s ease}
@keyframes eat{0%{transform:translate(-50%,-50%) scaleX(var(--dir,1)) scale(1)}40%{transform:translate(-50%,-50%) scaleX(var(--dir,1)) scale(1.3)}100%{transform:translate(-50%,-50%) scaleX(var(--dir,1)) scale(1)}}
.growthbar{position:absolute;width:30px;height:5px;background:#00000055;border-radius:4px;transform:translate(-50%,0);overflow:hidden;transition:left .12s linear,top .12s linear;z-index:2}
.growthbar i{display:block;height:100%;background:var(--good);width:0%}
.food{position:absolute;width:12px;height:12px;background:radial-gradient(#fff6c8,#ffd166);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #ffd16688;z-index:2}
.coin{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8d6,#ffd700 45%,#b8860b 100%);box-shadow:inset 0 0 0 2px #8a6200aa,0 2px 4px #00000066;transform:translate(-50%,-50%);cursor:pointer;animation:pop .25s ease;z-index:2}
.coinIcon{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8d6,#ffd700 45%,#b8860b 100%);box-shadow:inset 0 0 0 2px #8a6200aa}
.gem{position:absolute;font-size:22px;transform:translate(-50%,-50%);cursor:pointer;animation:pop .25s ease;z-index:2}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0.2)}100%{transform:translate(-50%,-50%) scale(1)}}
.invader{position:absolute;font-size:34px;transform:translate(-50%,-50%);cursor:pointer;animation:ibob 1.4s ease-in-out infinite;filter:drop-shadow(0 3px 6px #000000aa);z-index:2}
.boss{position:absolute;font-size:58px;cursor:pointer;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px #000000aa) drop-shadow(0 0 16px #ff3b3bcc);z-index:2;animation:ibob 1.8s ease-in-out infinite}
@keyframes ibob{0%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}100%{transform:translate(-50%,-50%) translateY(0)}}
.hpbar{position:absolute;height:6px;background:#00000066;border-radius:4px;transform:translate(-50%,0);overflow:hidden;z-index:2}
.hpbar i{display:block;height:100%;background:var(--danger)}
.floatText{position:absolute;font-weight:700;pointer-events:none;transform:translate(-50%,-50%);animation:floatUp .9s ease forwards;text-shadow:0 2px 4px #000000cc;white-space:nowrap;z-index:3}
@keyframes floatUp{0%{transform:translate(-50%,-50%) translateY(0) scale(1);opacity:1}100%{transform:translate(-50%,-50%) translateY(-55px) scale(1.1);opacity:0}}
#shopInner{padding:16px;width:100%}
.panelHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panelHeader span{font-size:18px}
.closeBtn{padding:6px 12px;border-radius:10px;background:linear-gradient(#ffffff26,#ffffff0d);color:var(--fg);border:none;font-family:inherit;font-weight:700;cursor:pointer}
.subTabs{display:flex;gap:6px;margin-bottom:14px}
.subTabs button{flex:1;padding:9px 2px;font-size:12px;border-radius:10px;background:#ffffff14;color:var(--fg);border:none;font-family:inherit;font-weight:700;cursor:pointer}
.subTabs button.active{background:linear-gradient(#ffd166,#ffb703);color:#3a2600}
h4{margin:14px 0 8px;font-size:14px;opacity:.85}
.shopItem{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-radius:14px;margin-bottom:8px;background:#ffffff0d;gap:8px}
.shopItem .icon{font-size:24px;margin-right:8px}
.shopItem .info{display:flex;align-items:center;flex:1;min-width:0}
.shopItem small{opacity:.8;display:block;font-size:11px;line-height:1.5}
.shopItem button{padding:10px 16px;border-radius:12px;background:linear-gradient(#ffffff26,#ffffff0d);color:var(--fg);border:none;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff2a}
.shopItem button:disabled{opacity:.4;cursor:not-allowed}
.dexBonus{background:#ffffff14;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dexCard{background:#ffffff0d;border-radius:12px;padding:10px 4px;text-align:center}
.dexCard.locked{opacity:.35}
.dexCard .emoji{font-size:26px;display:block}
.dexCard .nm{font-size:11px;display:block;margin-top:2px}
.dexCard .stage{font-size:10px;opacity:.85;margin-top:3px;display:block;color:var(--good)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#000000d9;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
<div class="pill"><span class="coinIcon"></span><b id="coinDisplay">0</b></div>
<div class="pill">💎<b id="diaDisplay">0</b></div>
<div class="pill">🐠<b id="fishDisplay">0</b></div>
<button onclick="openShop()">🛒 상점</button>
<button onclick="openDex()">📖 도감</button>
<button id="feedBtn" onclick="onFeedAllClick()">🔒 먹이주기</button>
<button onclick="openSettings()">⚙️ 설정</button>
</div>
<div id="shopPanel">
<div id="shopInner">
<div class="panelHeader"><span id="panelTitle">🛒 상점</span><button class="closeBtn" onclick="closePanel()">✕</button></div>
<div id="subTabs" class="subTabs">
<button onclick="showTab('fish')" id="subBtnFish">🐟 물고기</button>
<button onclick="showTab('upgrade')" id="subBtnUpgrade">⬆️ 업그레이드</button>
<button onclick="showTab('special')" id="subBtnSpecial">✨ 특별</button>
</div>
<div id="tabFishContent">
<div class="shopItem"><div class="info"><span class="icon">🐟</span><div>새끼 물고기 (랜덤 종류)<br><small id="fishCostText"></small></div></div><button id="buyFishBtn" onclick="buyRandomFish()">구매</button></div>
</div>
<div id="tabUpgradeContent" style="display:none">
<div class="shopItem"><div class="info"><span class="icon">🍤</span><div>먹이 업그레이드<br><small id="feedCostText"></small></div></div><button onclick="buyFeed()">구매</button></div>
<div class="shopItem"><div class="info"><span class="icon">🔫</span><div>무기 업그레이드<br><small id="weaponCostText"></small></div></div><button onclick="buyWeapon()">구매</button></div>
<div class="shopItem"><div class="info"><span class="icon">📈</span><div>코인 부스트<br><small id="coinBoostCostText"></small></div></div><button onclick="buyCoinBoost()">구매</button></div>
<div class="shopItem"><div class="info"><span class="icon">💎</span><div>다이아 부스트<br><small id="diaBoostCostText"></small></div></div><button onclick="buyDiaBoost()">구매</button></div>
</div>
<div id="tabSpecialContent" style="display:none">
<div class="shopItem" id="feedUnlockItem"><div class="info"><span class="icon">🍽</span><div>자동 먹이 (오토)<br><small id="feedUnlockCostText"></small></div></div><button onclick="buyFeedUnlock()">해금</button></div>
<div class="shopItem" id="autoAttackItem"><div class="info"><span class="icon">🤖</span><div>자동 공격<br><small id="autoAttackCostText"></small></div></div><button onclick="buyAutoAttack()">해금</button></div>
</div>
<div id="tabDexContent" style="display:none">
<div class="dexBonus" id="dexBonusText"></div>
<div id="dexGrid" class="grid"></div>
</div>
<div id="tabSettingsContent" style="display:none">
<div class="shopItem"><div class="info"><span class="icon">🎵</span><div>배경음악 &amp; 효과음<br><small>브라우저 정책상 화면을 한 번 터치해야 재생돼요</small></div></div><button id="soundToggleBtn" onclick="toggleSound()">켜짐</button></div>
</div>
</div>
</div>
<div id="main">
<div id="tank"></div>
<div id="bossBar"></div>
</div>
</div>
<div id="toast"></div>
<script>
var SPECIES=[
{name:'금붕어',emoji:'🐟',mult:1},
{name:'열대어',emoji:'🐠',mult:1.25},
{name:'복어',emoji:'🐡',mult:1.5},
{name:'새우',emoji:'🦐',mult:1.7},
{name:'게',emoji:'🦀',mult:1.9},
{name:'문어',emoji:'🐙',mult:2.2},
{name:'오징어',emoji:'🦑',mult:2.5},
{name:'랍스터',emoji:'🦞',mult:2.9},
{name:'거북이',emoji:'🐢',mult:3.3},
{name:'돌고래',emoji:'🐬',mult:3.8},
{name:'상어',emoji:'🦈',mult:4.4},
{name:'고래',emoji:'🐳',mult:5.2}
];
var tankEl=document.getElementById('tank');
var coinDisplay=document.getElementById('coinDisplay');
var diaDisplay=document.getElementById('diaDisplay');
var fishDisplay=document.getElementById('fishDisplay');
var toastEl=document.getElementById('toast');
var fishCostTextEl=document.getElementById('fishCostText');
var buyFishBtnEl=document.getElementById('buyFishBtn');
var feedCostTextEl=document.getElementById('feedCostText');
var weaponCostTextEl=document.getElementById('weaponCostText');
var coinBoostCostTextEl=document.getElementById('coinBoostCostText');
var diaBoostCostTextEl=document.getElementById('diaBoostCostText');
var feedUnlockCostTextEl=document.getElementById('feedUnlockCostText');
var autoAttackCostTextEl=document.getElementById('autoAttackCostText');
var dexBonusTextEl=document.getElementById('dexBonusText');
var panelTitleEl=document.getElementById('panelTitle');
var dexGridEl=document.getElementById('dexGrid');
var feedBtnEl=document.getElementById('feedBtn');
var soundToggleBtnEl=document.getElementById('soundToggleBtn');
var feedUnlockItemEl=document.getElementById('feedUnlockItem');
var autoAttackItemEl=document.getElementById('autoAttackItem');
var bossBarEl=document.getElementById('bossBar');
var subBtnFish=document.getElementById('subBtnFish');
var subBtnUpgrade=document.getElementById('subBtnUpgrade');
var subBtnSpecial=document.getElementById('subBtnSpecial');
var subTabsEl=document.getElementById('subTabs');
var shopPanelEl=document.getElementById('shopPanel');
var coins=50;
var diamonds=5;
var feedLevel=1;
var weaponLevel=2;
var coinBoostLevel=0;
var diaBoostLevel=0;
var feedAllUnlocked=false;
var autoAttackUnlocked=false;
var autoAttackCost=15;
var soundOn=true;
var audioCtx=null;
var bgMusicHandle=null;
var bgIndex=0;
var bgStarted=false;
var autoFeedCounter=0;
var autoFeedInterval=9;
var fishSeq=0;
var fishList=[];
var maxFish=24;
var invaders=[];
var invaderTimer=10;
var maxInvaders=3;
var boss=null;
var bossCountdown=180;
var feedUnlockCost=10;
var saveKey='fishTankSaveV9';
var tankWidth=0;
var tankHeight=0;
var toastTimer=null;
var maxStage=9;
var stageNeed=[2,2,3,3,3,4,4,4,5,0];
var fallingFoods=[];
var fallHandle=null;
var speciesUnlocked=[];
var speciesBestStage=[];
var dexEntries=[];
var unlockedCount=0;
var activeTab='fish';

for(var si=0;si<SPECIES.length;si++){speciesUnlocked.push(false);speciesBestStage.push(0)}

function updateTankSize(){
tankWidth=tankEl.clientWidth;
tankHeight=tankEl.clientHeight;
}

function ensureAudio(){
if(!audioCtx){
try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
}
return audioCtx;
}

function startBgIfNeeded(){
if(!soundOn||bgStarted)return;
var ctx=ensureAudio();
if(!ctx)return;
if(ctx.state==='suspended')ctx.resume();
bgStarted=true;
if(!bgMusicHandle)bgMusicHandle=setInterval(bgLoop,900);
}

document.addEventListener('pointerdown',startBgIfNeeded,{once:true});

function playTone(freq,duration,type,volume){
if(!soundOn)return;
var ctx=ensureAudio();
if(!ctx)return;
var osc=ctx.createOscillator();
var gain=ctx.createGain();
osc.type=type||'sine';
osc.frequency.value=freq;
gain.gain.value=volume||0.12;
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+duration);
osc.stop(ctx.currentTime+duration);
}

function playCoin(){playTone(880,0.12,'triangle',0.1);setTimeout(function(){playTone(1180,0.1,'triangle',0.08)},60)}
function playFeed(){playTone(320,0.07,'sine',0.06)}
function playLevelUp(){playTone(523,0.12,'square',0.08);setTimeout(function(){playTone(659,0.12,'square',0.08)},110);setTimeout(function(){playTone(784,0.18,'square',0.09)},220)}
function playHit(){playTone(140,0.07,'square',0.08)}
function playKill(){playTone(220,0.1,'triangle',0.09);setTimeout(function(){playTone(330,0.14,'triangle',0.09)},80)}
function playBossDefeat(){playTone(392,0.15,'square',0.1);setTimeout(function(){playTone(523,0.15,'square',0.1)},130);setTimeout(function(){playTone(659,0.2,'square',0.11)},260);setTimeout(function(){playTone(784,0.3,'square',0.12)},390)}
function playOuch(){playTone(100,0.15,'sawtooth',0.08)}

function bgLoop(){
var notes=[261.6,329.6,392.0,329.6,293.7,349.2];
var f=notes[bgIndex%notes.length];
playTone(f,0.7,'sine',0.035);
bgIndex++;
}

function toggleSound(){
soundOn=!soundOn;
if(soundOn){
soundToggleBtnEl.textContent='켜짐';
startBgIfNeeded();
if(audioCtx && audioCtx.state==='suspended')audioCtx.resume();
if(!bgMusicHandle)bgMusicHandle=setInterval(bgLoop,900);
}else{
soundToggleBtnEl.textContent='꺼짐';
if(bgMusicHandle){clearInterval(bgMusicHandle);bgMusicHandle=null}
bgStarted=false;
}
}

function toast(msg){
toastEl.textContent=msg;
toastEl.classList.add('show');
if(toastTimer)clearTimeout(toastTimer);
toastTimer=setTimeout(function(){toastEl.classList.remove('show')},1200);
}

function fmtTime(s){
if(s<0)s=0;
var m=Math.floor(s/60);
var sec=Math.floor(s%60);
return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

function showFloatText(x,y,text,color){
var el=document.createElement('div');
el.className='floatText';
el.textContent=text;
el.style.left=x+'px';
el.style.top=y+'px';
el.style.color=color;
el.style.fontSize=(text.indexOf('Lv')>=0?14:18)+'px';
tankEl.appendChild(el);
setTimeout(function(){el.remove()},900);
}

function dexBonus(){return 1+unlockedCount*0.05}

function fishCost(){return 8+fishList.length*5}
function feedCost(){return 20+feedLevel*15}
function weaponCost(){return 2+weaponLevel*1}
function coinBoostCost(){return 25+coinBoostLevel*30}
function diaBoostCost(){return 3+diaBoostLevel*2}
function sizeForStage(stage){return 22+stage*4}

function farFromFish(x,y,minDist){
for(var i=0;i<fishList.length;i++){
if(Math.hypot(fishList[i].x-x,fishList[i].y-y)<minDist)return false;
}
return true;
}

function makeDecor(){
for(var i=0;i<9;i++){
var s=document.createElement('div');
s.className='seaweed';
var h=30+Math.random()*40;
s.style.width=(10+Math.random()*6)+'px';
s.style.height=h+'px';
s.style.left=(Math.random()*94)+'%';
s.style.animationDuration=(2.4+Math.random()*2)+'s';
tankEl.appendChild(s);
}
for(var j=0;j<4;j++){
var r=document.createElement('div');
r.className='rock';
var w=30+Math.random()*40;
r.style.width=w+'px';
r.style.height=(w*0.6)+'px';
r.style.left=(Math.random()*90)+'%';
tankEl.appendChild(r);
}
var egg=document.createElement('div');
egg.className='reefEgg';
egg.textContent='🍍';
egg.style.right='14px';
egg.style.left='auto';
egg.title='???';
tankEl.appendChild(egg);
for(var k=0;k<10;k++){
var b=document.createElement('div');
b.className='bubble';
b.style.left=(Math.random()*100)+'%';
b.style.animationDuration=(4+Math.random()*4)+'s';
b.style.animationDelay=(Math.random()*6)+'s';
tankEl.appendChild(b);
}
}

function buildDex(){
for(var i=0;i<SPECIES.length;i++){
var card=document.createElement('div');
card.className='dexCard locked';
dexGridEl.appendChild(card);
dexEntries.push(card);
renderDexCard(i);
}
}

function renderDexCard(i){
var card=dexEntries[i];
if(speciesUnlocked[i]){
card.classList.remove('locked');
card.innerHTML='<span class="emoji">'+SPECIES[i].emoji+'</span><span class="nm">'+SPECIES[i].name+'</span><span class="stage">최고 Lv.'+(speciesBestStage[i]+1)+'</span>';
}else{
card.classList.add('locked');
card.innerHTML='<span class="emoji">❓</span><span class="nm">???</span><span class="stage"></span>';
}
}

function createFish(stage,species){
fishSeq++;
var wrap=document.createElement('div');
wrap.className='fish';
wrap.textContent=SPECIES[species].emoji;
var startX=20+Math.random()*Math.max(1,(tankWidth-40));
var startY=20+Math.random()*Math.max(1,(tankHeight-40));
wrap.style.left=startX+'px';
wrap.style.top=startY+'px';
wrap.onclick=function(){feedFish(f)};
tankEl.appendChild(wrap);
var bar=document.createElement('div');
bar.className='growthbar';
var fill=document.createElement('i');
bar.appendChild(fill);
tankEl.appendChild(bar);
var f={id:fishSeq,stage:stage,species:species,progress:0,hunger:0,el:wrap,bar:bar,fill:fill,coinTimer:4,x:startX,y:startY,vx:(Math.random()-0.5)*1.4,vy:(Math.random()-0.5)*1.4};
applyStageClass(f);
positionBar(f);
fishList.push(f);
if(!speciesUnlocked[species]){
speciesUnlocked[species]=true;
unlockedCount+=1;
if(dexEntries.length)renderDexCard(species);
toast('도감 등록! '+SPECIES[species].name+' · 코인 보너스 +5%');
}
if(stage>speciesBestStage[species]){
speciesBestStage[species]=stage;
if(dexEntries.length)renderDexCard(species);
}
return f;
}

function applyStageClass(f){
f.el.style.fontSize=sizeForStage(f.stage)+'px';
f.bar.style.display=f.stage>=maxStage?'none':'block';
}

function positionBar(f){
var offset=sizeForStage(f.stage)*0.5+8;
f.bar.style.left=f.x+'px';
f.bar.style.top=(f.y+offset)+'px';
}

function removeFish(f){
f.el.remove();
f.bar.remove();
var idx=fishList.indexOf(f);
if(idx>=0)fishList.splice(idx,1);
}

function feedFish(f){
if(!f||!fishList.includes(f))return;
f.hunger=0;
f.el.classList.remove('hungry');
f.el.classList.remove('eating');
void f.el.offsetWidth;
f.el.classList.add('eating');
playFeed();
var need=stageNeed[f.stage];
if(need>0){
f.progress+=feedLevel;
f.fill.style.width=Math.min(100,(f.progress/need)*100)+'%';
if(f.progress>=need){
f.stage=Math.min(maxStage,f.stage+1);
f.progress=0;
applyStageClass(f);
if(f.stage>speciesBestStage[f.species]){
speciesBestStage[f.species]=f.stage;
if(dexEntries.length)renderDexCard(f.species);
}
showFloatText(f.x,f.y-28,'레벨업! Lv.'+(f.stage+1),'#ffd166');
playLevelUp();
}
}
}

function spawnFood(x,y){
var el=document.createElement('div');
el.className='food';
el.style.left=x+'px';
el.style.top=y+'px';
tankEl.appendChild(el);
fallingFoods.push({el:el,x:x,y:y});
if(!fallHandle)fallHandle=setInterval(stepFalling,50);
}

function stepFalling(){
for(var i=fallingFoods.length-1;i>=0;i--){
var fo=fallingFoods[i];
fo.y+=7;
fo.el.style.top=fo.y+'px';
var consumed=false;
for(var j=0;j<fishList.length;j++){
var f=fishList[j];
if(Math.abs(f.x-fo.x)<38 && Math.abs(f.y-fo.y)<26){
feedFish(f);
consumed=true;
break;
}
}
if(consumed || fo.y>=tankHeight-10){
fo.el.remove();
fallingFoods.splice(i,1);
}
}
if(fallingFoods.length===0 && fallHandle){
clearInterval(fallHandle);
fallHandle=null;
}
}

function feedAll(){
var count=4;
for(var i=0;i<count;i++){
var x=(tankWidth/(count+1))*(i+1);
spawnFood(x,10);
}
}

function onFeedAllClick(){
if(!feedAllUnlocked){
toast('상점 특별 탭에서 자동 먹이를 먼저 해금하세요');
openShop();
showTab('special');
return;
}
feedAll();
}

function spawnCoin(f){
var base=(5+f.stage*4)*SPECIES[f.species].mult*(1+coinBoostLevel*0.2)*dexBonus();
var value=Math.round(base)+feedLevel*2;
var coinEl=document.createElement('div');
coinEl.className='coin';
coinEl.style.left=f.x+'px';
coinEl.style.top=Math.max(10,f.y-34)+'px';
coinEl.onclick=function(){
coins+=value;
updateHud();
showFloatText(f.x,f.y-45,'+'+value,'#ffd700');
playCoin();
coinEl.remove();
};
tankEl.appendChild(coinEl);
setTimeout(function(){if(coinEl.parentNode)coinEl.remove()},6000);
if(Math.random()<0.08){spawnGem(f)}
}

function spawnGem(f){
var gemEl=document.createElement('div');
gemEl.className='gem';
gemEl.textContent='💎';
gemEl.style.left=(f.x+(Math.random()*30-15))+'px';
gemEl.style.top=Math.max(10,f.y-52)+'px';
gemEl.onclick=function(){
diamonds+=1;
updateHud();
showFloatText(f.x,f.y-62,'💎+1','#7dd3fc');
playCoin();
gemEl.remove();
};
tankEl.appendChild(gemEl);
setTimeout(function(){if(gemEl.parentNode)gemEl.remove()},6000);
}

function applyDamage(inv){
if(!inv||!invaders.includes(inv))return;
inv.hp-=weaponLevel;
if(inv.hpFill)inv.hpFill.style.width=Math.max(0,(inv.hp/inv.maxHp)*100)+'%';
showFloatText(inv.x,inv.y-(inv.isBoss?52:26),'-'+weaponLevel,'#ff5d7a');
playHit();
if(inv.hp<=0){
if(inv.isBoss){
var reward=200+Math.floor(Math.random()*120);
coins+=reward;
diamonds+=5;
showFloatText(inv.x,inv.y-64,'+'+reward,'#ffd700');
toast('보스 처치! 🪙 +'+reward+' 💎 +5');
playBossDefeat();
despawnBoss(false);
}else{
var gain=1+diaBoostLevel;
diamonds+=gain;
inv.el.remove();
inv.hpEl.remove();
var idx=invaders.indexOf(inv);
if(idx>=0)invaders.splice(idx,1);
toast('침입자 처치! 💎 +'+gain);
playKill();
}
updateHud();
}
}

function spawnInvader(){
var x,y,tries=0;
do{
x=30+Math.random()*Math.max(1,(tankWidth-60));
y=30+Math.random()*Math.max(1,(tankHeight-60));
tries++;
}while(!farFromFish(x,y,60) && tries<12);
var el=document.createElement('div');
el.className='invader';
el.textContent='👾';
el.style.left=x+'px';
el.style.top=y+'px';
tankEl.appendChild(el);
var hp=document.createElement('div');
hp.className='hpbar';
hp.style.width='40px';
var fill=document.createElement('i');
fill.style.width='100%';
hp.appendChild(fill);
hp.style.left=x+'px';
hp.style.top=(y-30)+'px';
tankEl.appendChild(hp);
var inv={hp:3,maxHp:3,el:el,hpEl:hp,hpFill:fill,x:x,y:y,vx:(Math.random()-0.5)*0.7,vy:(Math.random()-0.5)*0.7,radius:20,isBoss:false};
el.onclick=function(){applyDamage(inv)};
invaders.push(inv);
}

function spawnBoss(){
var x,y,tries=0;
do{
x=tankWidth*0.3+Math.random()*tankWidth*0.4;
y=60+Math.random()*50;
tries++;
}while(!farFromFish(x,y,70) && tries<12);
var el=document.createElement('div');
el.className='boss';
el.textContent='🛸';
el.style.left=x+'px';
el.style.top=y+'px';
tankEl.appendChild(el);
var hp=document.createElement('div');
hp.className='hpbar';
hp.style.width='74px';
var fill=document.createElement('i');
fill.style.width='100%';
hp.appendChild(fill);
hp.style.left=x+'px';
hp.style.top=(y-48)+'px';
tankEl.appendChild(hp);
boss={hp:25,maxHp:25,el:el,hpEl:hp,hpFill:fill,x:x,y:y,timeLeft:75,vx:(Math.random()-0.5)*0.8,vy:(Math.random()-0.5)*0.8,radius:36,isBoss:true};
el.onclick=function(){applyDamage(boss)};
invaders.push(boss);
toast('🛸 보스 출현!');
}

function despawnBoss(escaped){
if(!boss)return;
boss.el.remove();
boss.hpEl.remove();
var idx=invaders.indexOf(boss);
if(idx>=0)invaders.splice(idx,1);
if(escaped)toast('보스가 도망쳤어요');
boss=null;
bossCountdown=180;
}

function moveTick(){
for(var i=fishList.length-1;i>=0;i--){
var f=fishList[i];
if(Math.random()<0.03){
f.vx=(Math.random()-0.5)*1.6;
f.vy=(Math.random()-0.5)*1.6;
}
f.x+=f.vx;
f.y+=f.vy;
if(f.x<20){f.x=20;f.vx=Math.abs(f.vx)}
if(f.x>tankWidth-20){f.x=tankWidth-20;f.vx=-Math.abs(f.vx)}
if(f.y<20){f.y=20;f.vy=Math.abs(f.vy)}
if(f.y>tankHeight-20){f.y=tankHeight-20;f.vy=-Math.abs(f.vy)}
f.el.style.left=f.x+'px';
f.el.style.top=f.y+'px';
f.el.style.setProperty('--dir',f.vx<0?-1:1);
positionBar(f);
var hit=false;
for(var k=0;k<invaders.length;k++){
var inv=invaders[k];
if(Math.hypot(f.x-inv.x,f.y-inv.y)<(inv.radius||20)){hit=true;break}
}
if(hit){
removeFish(f);
toast('물고기가 침입자에게 당했어요!');
playOuch();
}
}
for(var j=0;j<invaders.length;j++){
var inv=invaders[j];
var r=inv.radius||20;
if(Math.random()<0.02){
inv.vx=(Math.random()-0.5)*(inv.isBoss?0.8:0.7);
inv.vy=(Math.random()-0.5)*(inv.isBoss?0.8:0.7);
}
inv.x+=inv.vx;
inv.y+=inv.vy;
if(inv.x<r){inv.x=r;inv.vx=Math.abs(inv.vx)}
if(inv.x>tankWidth-r){inv.x=tankWidth-r;inv.vx=-Math.abs(inv.vx)}
if(inv.y<r+30){inv.y=r+30;inv.vy=Math.abs(inv.vy)}
if(inv.y>tankHeight-r){inv.y=tankHeight-r;inv.vy=-Math.abs(inv.vy)}
inv.el.style.left=inv.x+'px';
inv.el.style.top=inv.y+'px';
inv.hpEl.style.left=inv.x+'px';
inv.hpEl.style.top=(inv.y-(inv.isBoss?48:30))+'px';
}
}

function secondTick(){
if(boss){
boss.timeLeft-=1;
if(boss.timeLeft<=0){despawnBoss(true)}
}else{
bossCountdown-=1;
if(bossCountdown<=0){spawnBoss()}
}
if(feedAllUnlocked){
autoFeedCounter+=1;
if(autoFeedCounter>=autoFeedInterval){
autoFeedCounter=0;
feedAll();
}
}
if(autoAttackUnlocked && invaders.length>0){
applyDamage(invaders[0]);
}
if(boss){
bossBarEl.textContent='🛸 보스 등장! '+fmtTime(boss.timeLeft)+' 남음';
}else{
bossBarEl.textContent='다음 보스까지 '+fmtTime(bossCountdown);
}
updateHud();
}

function tick(){
if(fishList.length===0){
createFish(0,0);
toast('물고기가 없어서 한 마리를 지급했어요');
}
for(var i=0;i<fishList.length;i++){
var f=fishList[i];
f.hunger+=1;
if(f.hunger>6)f.el.classList.add('hungry');
if(f.hunger>40)f.hunger=40;
if(f.stage>=1){
f.coinTimer-=1;
if(f.coinTimer<=0){
spawnCoin(f);
f.coinTimer=Math.max(2,5-Math.floor(feedLevel/2));
}
}
}
invaderTimer-=1;
if(invaderTimer<=0 && invaders.length<maxInvaders){
spawnInvader();
invaderTimer=16;
}
updateHud();
saveGame();
}

function updateHud(){
coinDisplay.textContent=coins;
diaDisplay.textContent=diamonds;
fishDisplay.textContent=fishList.length+'/'+maxFish;
var atCap=fishList.length>=maxFish;
fishCostTextEl.textContent=atCap?'수조가 가득 찼어요 (최대 '+maxFish+'마리)':'구매가 '+fishCost()+'코인 · 12종 중 랜덤 지급';
buyFishBtnEl.disabled=atCap;
feedCostTextEl.textContent='구매가 '+feedCost()+'코인 · 성장치 +'+feedLevel+' → +'+(feedLevel+1)+' · 코인보너스 +'+(feedLevel*2)+' → +'+((feedLevel+1)*2);
weaponCostTextEl.textContent='구매가 '+weaponCost()+'다이아 · 공격력 '+weaponLevel+' → '+(weaponLevel+1);
coinBoostCostTextEl.textContent='구매가 '+coinBoostCost()+'코인 · 코인 배율 x'+(1+coinBoostLevel*0.2).toFixed(1)+' → x'+(1+(coinBoostLevel+1)*0.2).toFixed(1);
diaBoostCostTextEl.textContent='구매가 '+diaBoostCost()+'다이아 · 처치보상 +'+(1+diaBoostLevel)+' → +'+(2+diaBoostLevel);
feedUnlockCostTextEl.textContent='다이아 '+feedUnlockCost+' · 주기적으로 먹이가 자동으로 떨어져요';
autoAttackCostTextEl.textContent='다이아 '+autoAttackCost+' · 적이 나타나면 자동으로 공격해요';
dexBonusTextEl.textContent='도감 수집 '+unlockedCount+'/'+SPECIES.length+' · 코인 보너스 +'+(unlockedCount*5)+'%';
feedBtnEl.textContent=feedAllUnlocked?'🍤 먹이주기':'🔒 먹이주기';
feedBtnEl.classList.toggle('locked',!feedAllUnlocked);
feedUnlockItemEl.style.display=feedAllUnlocked?'none':'flex';
autoAttackItemEl.style.display=autoAttackUnlocked?'none':'flex';
}

function buyRandomFish(){
if(fishList.length>=maxFish){toast('수조가 가득 찼어요');return}
var cost=fishCost();
if(coins<cost){toast('코인이 부족해요');return}
coins-=cost;
var idx=Math.floor(Math.random()*SPECIES.length);
createFish(0,idx);
updateHud();
toast(SPECIES[idx].name+' 입양!');
}

function buyFeed(){
var cost=feedCost();
if(coins<cost){toast('코인이 부족해요');return}
coins-=cost;
feedLevel+=1;
updateHud();
toast('먹이 업그레이드!');
}

function buyWeapon(){
var cost=weaponCost();
if(diamonds<cost){toast('다이아가 부족해요');return}
diamonds-=cost;
weaponLevel+=1;
updateHud();
toast('무기 업그레이드!');
}

function buyCoinBoost(){
var cost=coinBoostCost();
if(coins<cost){toast('코인이 부족해요');return}
coins-=cost;
coinBoostLevel+=1;
updateHud();
toast('코인 부스트 업그레이드!');
}

function buyDiaBoost(){
var cost=diaBoostCost();
if(diamonds<cost){toast('다이아가 부족해요');return}
diamonds-=cost;
diaBoostLevel+=1;
updateHud();
toast('다이아 부스트 업그레이드!');
}

function buyFeedUnlock(){
if(feedAllUnlocked)return;
if(diamonds<feedUnlockCost){toast('다이아가 부족해요');return}
diamonds-=feedUnlockCost;
feedAllUnlocked=true;
autoFeedCounter=0;
updateHud();
toast('자동 먹이 해금!');
}

function buyAutoAttack(){
if(autoAttackUnlocked)return;
if(diamonds<autoAttackCost){toast('다이아가 부족해요');return}
diamonds-=autoAttackCost;
autoAttackUnlocked=true;
updateHud();
toast('자동 공격 해금!');
}

function isShopTab(t){return t==='fish'||t==='upgrade'||t==='special'}

function showTab(tab){
activeTab=tab;
document.getElementById('tabFishContent').style.display=tab==='fish'?'block':'none';
document.getElementById('tabUpgradeContent').style.display=tab==='upgrade'?'block':'none';
document.getElementById('tabSpecialContent').style.display=tab==='special'?'block':'none';
document.getElementById('tabDexContent').style.display=tab==='dex'?'block':'none';
document.getElementById('tabSettingsContent').style.display=tab==='settings'?'block':'none';
subTabsEl.style.display=isShopTab(tab)?'flex':'none';
panelTitleEl.textContent=tab==='dex'?'📖 도감':(tab==='settings'?'⚙️ 설정':'🛒 상점');
subBtnFish.classList.toggle('active',tab==='fish');
subBtnUpgrade.classList.toggle('active',tab==='upgrade');
subBtnSpecial.classList.toggle('active',tab==='special');
}

function afterPanelToggle(){setTimeout(updateTankSize,280)}

function openShop(){
if(shopPanelEl.classList.contains('open') && isShopTab(activeTab)){
shopPanelEl.classList.remove('open');
afterPanelToggle();
return;
}
shopPanelEl.classList.add('open');
showTab('fish');
updateHud();
afterPanelToggle();
}

function openDex(){
if(shopPanelEl.classList.contains('open') && activeTab==='dex'){
shopPanelEl.classList.remove('open');
afterPanelToggle();
return;
}
shopPanelEl.classList.add('open');
showTab('dex');
updateHud();
afterPanelToggle();
}

function openSettings(){
if(shopPanelEl.classList.contains('open') && activeTab==='settings'){
shopPanelEl.classList.remove('open');
afterPanelToggle();
return;
}
shopPanelEl.classList.add('open');
showTab('settings');
afterPanelToggle();
}

function closePanel(){
shopPanelEl.classList.remove('open');
afterPanelToggle();
}

function saveGame(){
var data={
coins:coins,
diamonds:diamonds,
feedLevel:feedLevel,
weaponLevel:weaponLevel,
coinBoostLevel:coinBoostLevel,
diaBoostLevel:diaBoostLevel,
feedAllUnlocked:feedAllUnlocked,
autoAttackUnlocked:autoAttackUnlocked,
soundOn:soundOn,
speciesUnlocked:speciesUnlocked,
speciesBestStage:speciesBestStage,
fish:fishList.map(function(f){return {stage:f.stage,species:f.species,progress:f.progress,hunger:f.hunger,x:f.x,y:f.y}})
};
try{localStorage.setItem(saveKey,JSON.stringify(data))}catch(e){}
}

function loadGame(){
var raw=null;
try{raw=localStorage.getItem(saveKey)}catch(e){}
if(!raw)return false;
var data=null;
try{data=JSON.parse(raw)}catch(e){return false}
if(!data)return false;
coins=data.coins||50;
diamonds=data.diamonds||5;
feedLevel=data.feedLevel||1;
weaponLevel=data.weaponLevel||2;
coinBoostLevel=data.coinBoostLevel||0;
diaBoostLevel=data.diaBoostLevel||0;
feedAllUnlocked=data.feedAllUnlocked||false;
autoAttackUnlocked=data.autoAttackUnlocked||false;
soundOn=data.soundOn===false?false:true;
if(data.speciesUnlocked)speciesUnlocked=data.speciesUnlocked;
if(data.speciesBestStage)speciesBestStage=data.speciesBestStage;
for(var i=0;i<speciesUnlocked.length;i++){if(speciesUnlocked[i])unlockedCount++}
var list=data.fish||[];
var cap=Math.min(list.length,maxFish);
for(var k=0;k<cap;k++){
var saved=list[k];
var f=createFish(saved.stage,saved.species||0);
f.progress=saved.progress;
f.hunger=saved.hunger;
f.x=saved.x;
f.y=saved.y;
f.el.style.left=f.x+'px';
f.el.style.top=f.y+'px';
var need=stageNeed[f.stage];
if(need>0)f.fill.style.width=Math.min(100,(f.progress/need)*100)+'%';
positionBar(f);
if(f.hunger>6)f.el.classList.add('hungry');
}
return true;
}

tankEl.onclick=function(e){
if(e.target!==tankEl)return;
var rect=tankEl.getBoundingClientRect();
var x=e.clientX-rect.left;
var y=e.clientY-rect.top;
spawnFood(x,y);
};

window.onload=function(){
updateTankSize();
makeDecor();
buildDex();
var loaded=loadGame();
if(!loaded){
createFish(0,0);
createFish(0,0);
}
soundToggleBtnEl.textContent=soundOn?'켜짐':'꺼짐';
updateHud();
tick();
secondTick();
setInterval(tick,1500);
setInterval(moveTick,120);
setInterval(secondTick,1000);
};

window.addEventListener('resize',updateTankSize);
</script>
</body>
</html>
